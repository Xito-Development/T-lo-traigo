name: 🐞 Algo no funciona
description: Informa de un fallo de la app o de la web
labels: [fallo]
body:
  - type: textarea
    id: que
    attributes: { label: ¿Qué ha pasado?, description: Qué esperabas y qué ha ocurrido. }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para que vuelva a pasar, placeholder: "1. Abro… 2. Pulso… 3. Sale…" }
  - type: input
    id: version
    attributes: { label: Versión de la app, description: Ajustes → abajo del todo. }
  - type: input
    id: movil
    attributes: { label: Móvil y versión de Android }
  - type: markdown
    attributes: { value: "No pongas datos personales (direcciones, teléfonos, correos) ni capturas con ellos." }
