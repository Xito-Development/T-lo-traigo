name: Android CI/CD

# Flujo automático:
#  - Cada push a main compila la app.
#  - Si version.properties tiene una versión nueva (sin tag vX.Y.Z), se crea el tag y la Release
#    con APK + AAB y las notas del CHANGELOG.md, y (si hay secreto) se sube a Google Play.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      VERSION_CODE: ${{ github.run_number }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versión y tipo de build
        id: v
        run: |
          V=$(sed 's/^\xEF\xBB\xBF//' version.properties | grep '^VERSION_NAME=' | cut -d= -f2 | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          RELEASE=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then RELEASE=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then RELEASE=true; fi
          if [ "$RELEASE" = "true" ]; then NAME="$V"; else NAME="$V-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "### Versión $NAME · Release: $RELEASE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Aviso sin keystore
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Sin KEYSTORE_BASE64. Ejecuta scripts/configurar-firma.ps1 (el APK se firma con clave debug y no será actualizable)."

      - name: Compilar APK y AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # APK "github" (con actualizador) para las Releases y AAB "play" (sin actualizador) para Google Play
          ./gradlew --no-daemon testGithubDebugUnitTest   # si alguna prueba falla, no se publica
          ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease :control:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/TLoTraigo-${VERSION_NAME}.apk"
          # Nombre fijo: la web y la app descargan siempre .../releases/latest/download/TLoTraigo.apk
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/TLoTraigo.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/TLoTraigo-${VERSION_NAME}.aab"
          # Herramienta interna: va en su propia pre-release «panel-vX.Y.Z», no en la versión pública
          mkdir -p dist-panel
          cp control/build/outputs/apk/release/control-release.apk "dist-panel/TLoTraigo-Control.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TLoTraigo-${{ env.VERSION_NAME }}
          path: dist/*
          retention-days: 14

      - name: Notas de la versión desde CHANGELOG.md
        if: steps.v.outputs.release == 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | awk 'tolower($0) ~ /^### *interno/ {skip=1; next} /^### / {skip=0} !skip' > dist/NOTES.md   # nunca se publica la sección «Interno»
          [ -s dist/NOTES.md ] || echo "Mejoras y correcciones." > dist/NOTES.md
          printf '\n---\n**Descarga:** `TLoTraigo.apk` (Android 5.0 o superior). Si ya tienes la app, se actualiza sola.\n' >> dist/NOTES.md

      - name: Publicar Release (crea el tag si no existe)
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T lo traigo ${{ steps.v.outputs.version }}
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/*.aab
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.v.outputs.version, '-') }}

      - name: Análisis de VirusTotal (enlace y huella en las notas)
        if: steps.v.outputs.release == 'true' && env.VT_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          SHA=$(sha256sum dist/TLoTraigo.apk | cut -d' ' -f1)
          curl -s -o /dev/null -w "VirusTotal: %{http_code}\n" --request POST --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" --form file=@dist/TLoTraigo.apk || true
          gh release view "v$V" --json body -q .body > body.md
          printf '\n🛡️ **Análisis de seguridad:** [VirusTotal](https://www.virustotal.com/gui/file/%s) · SHA-256 `%s`\n' "$SHA" "$SHA" >> body.md
          gh release edit "v$V" --notes-file body.md

      - name: Publicar herramienta interna (pre-release)
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Herramienta interna ${{ steps.v.outputs.version }}
          body: Uso interno del equipo. No es necesaria para usar T lo traigo.
          files: dist-panel/*.apk
          prerelease: true
          make_latest: false

      - name: Subir a Google Play (pruebas internas)
        if: steps.v.outputs.release == 'true' && env.PLAY_JSON != '' && env.KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.unocerobits.tlotraigo
          releaseFiles: dist/*.aab
          track: internal
          status: draft
          whatsNewDirectory: fastlane/metadata/android/es-ES/changelogs
